name: Backend Tests

# Runs the backend test suite so an auth/ownership regression (like the one
# that briefly broke the live app on 2026-08-23) is caught before it reaches
# main, instead of being discovered by real caregivers after Cloud Build
# auto-deploys. Set as a required status check on main's branch protection
# so a PR cannot merge with a red build.

on:
  pull_request:
    branches: [main]
    paths:
      - "neurodecode_backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [dev]
    paths:
      - "neurodecode_backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neurodecode_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: neurodecode_backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v
